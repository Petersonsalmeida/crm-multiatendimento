# Nginx interno do container do frontend — serve o build estático do Vite.
# O TLS e o roteamento por domínio ficam no Nginx do host (ver
# deploy/nginx/), que faz proxy para cá.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: o react-router usa BrowserRouter, então qualquer rota
    # desconhecida precisa devolver o index.html em vez de 404.
    # O index.html nunca é cacheado, senão um deploy novo não aparece.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
