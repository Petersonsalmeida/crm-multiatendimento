# =====================================================================
# AliançaCRM — server block para o Nginx JÁ EXISTENTE no VPS
# =====================================================================
# Este arquivo não vai para dentro de container nenhum. Ele é instalado
# no Nginx do host, ao lado dos blocks de n8n e Evolution API:
#
#   sudo cp deploy/nginx/crm.centroautoalianca.com.br.conf \
#           /etc/nginx/sites-available/crm.centroautoalianca.com.br
#   sudo ln -s /etc/nginx/sites-available/crm.centroautoalianca.com.br \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# As diretivas de TLS abaixo são preenchidas pelo Certbot ao rodar:
#   sudo certbot --nginx -d crm.centroautoalianca.com.br
# Antes disso, mantenha só o bloco :80 (o Certbot cria o :443 sozinho).
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name crm.centroautoalianca.com.br;

    # O Certbot troca isto por um redirect 301 para HTTPS depois de
    # emitir o certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.centroautoalianca.com.br;

    # Gerenciados pelo Certbot:
    # ssl_certificate     /etc/letsencrypt/live/crm.centroautoalianca.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.centroautoalianca.com.br/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Não expor a versão do Nginx nas respostas de erro.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads de mídia do WhatsApp podem passar por aqui; o backend
    # limita o JSON em 1mb, isto é a folga do transporte.
    client_max_body_size 10m;

    # -----------------------------------------------------------------
    # API — o backend escuta só em 127.0.0.1 (ver docker-compose.yml)
    # -----------------------------------------------------------------
    location /api/ {
        # A barra final faz o Nginx remover o prefixo /api antes de
        # repassar: /api/contacts no navegador vira /contacts no
        # Express, que é como as rotas estão montadas.
        proxy_pass http://127.0.0.1:3001/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # O backend roda com `trust proxy` ligado e lê este header para
        # aplicar rate limit por IP real em vez do IP do proxy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade para WebSocket, caso o Realtime passe a trafegar aqui.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------
    # Frontend — SPA estática servida pelo container do Vite build
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/crm.access.log;
    error_log  /var/log/nginx/crm.error.log;
}
